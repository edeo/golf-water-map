name: Daily water use update

on:
  schedule:
    - cron: "0 13 * * *"  # 6am Pacific / 7am Arizona (roughly, ignoring DST)
  workflow_dispatch: {}

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed database if missing
        run: |
          if [ ! -f data/golf_water.db ]; then
            python scripts/seed_courses.py
          fi

      - name: Compute today's water use
        env:
          CIMIS_APP_KEY: ${{ secrets.CIMIS_APP_KEY }}
        run: python scripts/compute_water_use.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/golf_water.db
          git diff --staged --quiet || git commit -m "Update daily water use data"
          git push

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Publish to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          datasette publish fly data/golf_water.db \
            --app golf-water-map \
            --metadata metadata.json \
            --install datasette-cluster-map \
            --template-dir templates \
            --yes
